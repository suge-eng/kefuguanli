server:
  port: 9014

spring:
  application:
    name: ai-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    # Feign 熔断降级 + 超时（OpenFeign 4.x 的配置前缀是 spring.cloud.openfeign，
    # 旧版 feign.client.config 已不生效）
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
  datasource:
    # AI 服务独立库 ai_db（按服务拆库，避免跨服务共享表）
    url: jdbc:mysql://localhost:3307/ai_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

rocketmq:
  name-server: localhost:9876
  producer:
    group: ai-producer-group
    send-message-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，方便联调排查；上线前关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# AI 能力配置
# mock-enabled=true 时使用内置 Mock 实现，无真实 Key 也能跑通全链路；
# 切换真实模型：设环境变量 AI_API_KEY 后把 mock-enabled 改 false
# （Key 不写入源码，避免凭据进入代码仓库和打包产物）
ai:
  chat:
    mock-enabled: false
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1   # OpenAI 兼容端点
    api-key: ${AI_API_KEY:}
    model: deepseek-v4.1-flash-1017
    timeout-ms: 60000
    retry-times: 2
  embedding:
    mock-enabled: false
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1   # 向量模型用通义 text-embedding-v3
    api-key: ${ai.chat.api-key}
    model: text-embedding-v3
    dimension: 1024           # text-embedding-v3 输出维度，Milvus 集合维度必须一致
    timeout-ms: 30000
  warning:
    timeout-check-delay-level: 16   # 超时未处理检查的延时档位：16=30分钟（与预警规则 timeoutMinutes 对应）

milvus:
  host: localhost
  port: 19530
  collection: knowledge_base

# 熔断器参数：10 次滑动窗口内失败率过半就打开，10 秒后放3个请求试探恢复
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

# knife4j 接口文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn
