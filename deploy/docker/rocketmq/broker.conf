# RocketMQ Broker 配置
# brokerIP1 指向宿主机：业务微服务跑在宿主机 IDE 中，
# 通过 NameServer 拿到 broker 地址后需要能直连，因此通告宿主机地址
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
# broker 对外通告的地址：Java 服务跑在宿主机、dashboard 跑在容器里，
# 两侧都要能直连 broker，因此通告宿主机局域网 IP（两侧均可达）；
# host.docker.internal 在宿主机侧默认不解析，不能用
# 注意：若本机 IP 变化（DHCP），需同步修改此处并重建 broker 容器
brokerIP1=172.28.108.138
listenPort=10911
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
# 自动创建 Topic，开发阶段方便（生产应关闭）
autoCreateTopicEnable=true
storePathRootDir=/home/rocketmq/store
